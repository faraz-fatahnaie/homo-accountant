# ============================================================
# Development stack — docker compose up
# ============================================================
name: homo-accountant-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arya_dev_pw}
      POSTGRES_DB: arya_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arya -d arya_dev"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aryaminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-arya_minio_dev_pw}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    build: ./apps/api
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      HOMO_DATABASE_URL: postgresql+psycopg://arya:${POSTGRES_PASSWORD:-arya_dev_pw}@db:5432/arya_dev
      HOMO_ENVIRONMENT: development
      HOMO_JWT_SECRET: ${HOMO_JWT_SECRET:-dev-only-jwt-secret-change-me}
      HOMO_CORS_ORIGINS: http://localhost:3000
      HOMO_SEED_DEMO_USERS: "true"
      HOMO_LOGIN_RATE_LIMIT_PER_MINUTE: 100  # higher in dev so E2E suites can run; prod uses 10
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/srv/api
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      # anonymous volume: node_modules always fresh from the dev image
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
