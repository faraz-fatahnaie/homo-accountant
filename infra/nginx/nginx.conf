# Production reverse proxy — TLS termination, security headers, upload limits.
# TLS: place certificates at infra/nginx/ssl/{fullchain.pem,privkey.pem}
# (e.g. certbot --nginx, or Let's Encrypt DNS challenge) or edit the paths below.
# HTTPS-ready: without certs nginx fails to start; provide certs or switch
# server 443 block to listen 80 only during first setup (see docs/deployment.md).

limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;

# HTTP -> HTTPS
server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;          # attachments
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

    # Web app
    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API (same origin so the browser never needs CORS in production)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # OpenAPI docs (API)
    location = /docs { return 301 /api/docs; }
    location /api/docs { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location /api/openapi.json { proxy_pass http://api:8000; proxy_set_header Host $host; }
}
