[project]
name = "homo-accountant-api"
version = "0.1.0"
description = "Homo Accountant accounting API — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pyjwt>=2.9,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "email-validator>=2.1,<3.0",
    "jdatetime>=5.0,<7.0",
    "reportlab>=4.0,<5.0",
    "arabic-reshaper>=3.0,<4.0",
    "python-bidi>=0.4,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S"]
ignore = [
    "S101",  # assert allowed in tests
    "B008",  # Depends(...) in defaults is the FastAPI idiom
    "S105",  # pydantic field named token_type / demo fixture passwords
    "S106",  # hardcoded passwords are intentional in test fixtures only
    "S107",  # hardcoded passwords are intentional in test fixtures only
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "app/core/logging.py"]

[tool.coverage.report]
fail_under = 80

[[tool.mypy.overrides]]
module = "jdatetime"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["arabic_reshaper", "bidi.*", "reportlab.*"]
ignore_missing_imports = true
