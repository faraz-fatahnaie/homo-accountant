# ============================================================
# Production-oriented stack (Linux VPS) — docker compose -f compose.prod.yaml up -d
# Reverse proxy: infra/nginx/nginx.conf (TLS terminated by nginx)
# ============================================================
name: homo-accountant-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  media-init:
    image: homo-accountant/api:${IMAGE_TAG:-latest}
    user: root
    command: ["sh", "-c", "mkdir -p /srv/api/media && chown -R app:app /srv/api/media"]
    volumes:
      - media:/srv/api/media
    logging: *default-logging
    restart: "no"

  api:
    build: ./apps/api
    image: homo-accountant/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"]
    environment:
      HOMO_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      HOMO_ENVIRONMENT: production
      HOMO_JWT_SECRET: ${HOMO_JWT_SECRET}
      HOMO_CORS_ORIGINS: ${HOMO_CORS_ORIGINS}
      HOMO_ADMIN_BOOTSTRAP_EMAIL: ${HOMO_ADMIN_BOOTSTRAP_EMAIL}
      HOMO_ADMIN_BOOTSTRAP_PASSWORD: ${HOMO_ADMIN_BOOTSTRAP_PASSWORD}
      HOMO_MEDIA_DIR: /srv/api/media
    volumes:
      - media:/srv/api/media
    depends_on:
      db:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
    logging: *default-logging
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    image: homo-accountant/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: /api/v1   # served through nginx (same origin)
      PORT: 3000
    depends_on:
      - api
    logging: *default-logging
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/login"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
      - nginxcache:/var/cache/nginx
    depends_on:
      - web
      - api
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 6

volumes:
  pgdata:
  media:
  nginxcache:
