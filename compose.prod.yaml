# ============================================================
# Production-oriented stack (Linux VPS) — docker compose -f compose.prod.yaml up -d
# Reverse proxy: infra/nginx/nginx.conf (TLS terminated by nginx)
# ============================================================
name: arya-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    build: ./apps/api
    image: arya/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ARYA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ARYA_ENVIRONMENT: production
      ARYA_JWT_SECRET: ${ARYA_JWT_SECRET}
      ARYA_CORS_ORIGINS: ${ARYA_CORS_ORIGINS}
      ARYA_ADMIN_BOOTSTRAP_EMAIL: ${ARYA_ADMIN_BOOTSTRAP_EMAIL}
      ARYA_ADMIN_BOOTSTRAP_PASSWORD: ${ARYA_ADMIN_BOOTSTRAP_PASSWORD}
      ARYA_S3_ENDPOINT: http://minio:9000
      ARYA_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      ARYA_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      ARYA_S3_BUCKET: ${ARYA_S3_BUCKET:-arya-attachments}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build: ./apps/web
    image: arya/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: /api/v1   # served through nginx (same origin)
      PORT: 3000
    depends_on:
      - api
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/login"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
      - nginxcache:/var/cache/nginx
    depends_on:
      - web
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 6

volumes:
  pgdata:
  miniodata:
  nginxcache:
