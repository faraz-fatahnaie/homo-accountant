name: Docker

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # All variables compose.prod.yaml interpolates. Without these the
      # Postgres role/password and HOMO_JWT_SECRET come out empty and the
      # stack fails to start (this was breaking the smoke test).
      POSTGRES_USER: arya
      POSTGRES_PASSWORD: ci_prod_pw
      POSTGRES_DB: arya_prod
      HOMO_JWT_SECRET: ci-secret-not-for-prod-0123456789
      HOMO_CORS_ORIGINS: https://example.com
      HOMO_ADMIN_BOOTSTRAP_EMAIL: ""
      HOMO_ADMIN_BOOTSTRAP_PASSWORD: ""
      MINIO_ROOT_USER: ci_minio_user
      MINIO_ROOT_PASSWORD: ci_minio_password
      HOMO_S3_BUCKET: homo-accountant-attachments
      IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build production images (api + web)
        run: docker compose -f compose.prod.yaml build api web
      - name: Start production-like stack (ports via smoke override)
        run: |
          docker compose -f compose.prod.yaml -f .github/compose.smoke.yaml up -d db minio api web
          for i in $(seq 1 90); do
            curl -sf http://localhost:8000/api/v1/health/ready && break || sleep 2
          done
          curl -sf http://localhost:8000/api/v1/health/ready
          curl -sf -o /dev/null http://localhost:3000/login
          docker compose -f compose.prod.yaml ps
      - name: Image scan (trivy) — API
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: homo-accountant/api:ci
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          # Fail only on FIXABLE high/critical findings. Base images are
          # pinned to digests — bump them deliberately (Dockerfile "bump:"
          # comments) rather than chasing moving tags.
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
      - name: Image scan (trivy) — Web
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: homo-accountant/web:ci
          format: sarif
          output: trivy-web.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
      - name: Upload trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-api.sarif
            trivy-web.sarif
          retention-days: 14

  # Publishing images / deploying happens ONLY when the owner configures
  # registry credentials and explicitly authorizes it (see docs/deployment.md).
  publish:
    if: ${{ false }} # disabled by default — enable with credentials + review
    runs-on: ubuntu-latest
    needs: build-and-smoke
    steps:
      - run: echo "Publishing intentionally disabled until owner authorizes registry access."
