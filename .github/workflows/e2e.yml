name: E2E

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # weekly Monday QA

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HOMO_JWT_SECRET: ci-secret-not-for-prod-0123456789
      POSTGRES_USER: arya
      POSTGRES_PASSWORD: e2e_pw
      POSTGRES_DB: arya_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Start real test stack (PostgreSQL, MinIO, API, web)
        run: |
          docker compose up -d --build db minio api web
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/api/v1/health/ready && break || sleep 2
          done
          curl -sf http://localhost:8000/api/v1/health/ready
          curl -sf -o /dev/null http://localhost:3000/login
      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run role-based user journeys (desktop + mobile)
        working-directory: tests/e2e
        run: npx playwright test
      - name: Upload report + traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14
