name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1" # weekly

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write # for CodeQL upload

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Python dependency audit
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: apps/api/requirements.txt
          vulnerability-service: osv
      - name: Node dependency audit
        working-directory: apps/web
        run: |
          npm audit --omit=dev --audit-level=high || echo "npm audit found issues — see report"
      - name: Secret scanning
        uses: trufflesecurity/trufflehog@v3.88.0
        with:
          extra_args: --results=verified,unknown --only-verified=false

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python, javascript-typescript
      - uses: github/codeql-action/analyze@v3
